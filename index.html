<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Order summary card</title>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="card__image">
          <img src="./images/illustration-hero.svg" alt="Illustration Hero">
        </div>
        <h1 class="card__heading">Order Summary</h1>

        <p class="card__text">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
        <div class="card__plan">
          <img class="card__plan-icon" src="./images/icon-music.svg" alt="Music Icon">
          <div class="card__plan-details">
            <h2 class="card__plan-title">Annual Plan</h2>
            <p class="card__plan-price">$59.99/year</p>
          </div>
          <a class="card__plan-change" href="#">Change</a>
        </div>

        <button class="button button--confirm">Proceed to Payment</button>
        <button class="button button--cancel">Cancel Order</button>
      </section>
    </main>
    <footer>
      <div class="attribution">
        <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="https://github.com/arne-witteler">Arne Witteler</a>.</p>
      </div>
    </footer>
  </body>
</html>
